<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コード譜ライブラリ</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --accent-color: #2563eb;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 10px 15px -3px rgba(37, 99, 235, 0.1), 0 4px 6px -2px rgba(37, 99, 235, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            margin-bottom: 32px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin: 0 0 8px 0;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.875rem;
            margin: 0;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            box-shadow: var(--shadow);
            transition: all 0.2s ease-in-out;
        }

        .card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            color: var(--accent-color);
        }

        .card .icon {
            font-size: 1.2rem;
            margin-right: 12px;
        }

        .card .content {
            display: flex;
            align-items: center;
        }

        .card .arrow {
            color: var(--text-sub);
            transition: transform 0.2s ease;
        }

        .card:hover .arrow {
            transform: translateX(4px);
            color: var(--accent-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎵 Chord Score Library</h1>
        <p class="subtitle">コード譜・楽曲メモ一覧</p>
    </header>

    <div class="list">
        <!-- target="_blank" rel="noopener" を追加しました -->
        <a href="chord_kagome.html" class="card" target="_blank" rel="noopener">
            <div class="content">
                <span class="icon">🎸</span>
                <span>コード譜 かごめ（優里）</span>
            </div>
            <span class="arrow">→</span>
        </a>
    </div>
</div>

</body>
</html>
