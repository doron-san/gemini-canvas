<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages URL Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 flex justify-center items-center">

    <div class="w-full max-w-lg bg-slate-800 border border-slate-700 rounded-2xl p-6 md:p-8 shadow-2xl space-y-6">
        
        <!-- Header -->
        <div class="border-b border-slate-700 pb-4">
            <div class="flex items-center justify-between">
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <span class="text-2xl">🔗</span> GitHub Pages URL 生成ツール
                </h1>
                <span id="apiStatus" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-700 text-slate-300">
                    API連携準備中
                </span>
            </div>
            <p class="text-xs text-slate-400 mt-1">ファイル名を入力するだけでNotion貼付用URLを即座に作成します</p>
        </div>

        <!-- Settings (User & Dynamic Repositories via API) -->
        <div class="p-3.5 bg-slate-900/70 rounded-xl border border-slate-700/60 space-y-3">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1 font-medium">GitHubユーザー名</label>
                    <div class="flex gap-1.5">
                        <input type="text" id="username" value="doron-san" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-blue-500 font-mono">
                        <button id="reloadReposBtn" title="リポジトリ一覧を再取得" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 rounded-lg transition-colors flex items-center justify-center">
                            🔄
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1 font-medium flex justify-between">
                        <span>リポジトリ名</span>
                        <span id="repoCount" class="text-[10px] text-blue-400">取得中...</span>
                    </label>
                    <!-- API取得されたリポジトリがここに自動挿入されます -->
                    <select id="repoSelect" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-blue-500 cursor-pointer">
                        <option value="gemini-canvas">gemini-canvas</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Main Input -->
        <div class="space-y-2">
            <label class="block text-sm font-semibold text-slate-200">
                HTMLファイル名 <span class="text-xs text-slate-400 font-normal">(.html は自動補完されます)</span>
            </label>
            <div class="relative flex items-center">
                <input type="text" id="filename" placeholder="例: chord_kagome" autofocus
                    class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-base text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all font-mono">
                <button id="clearBtn" class="hidden absolute right-3 text-slate-400 hover:text-slate-200 text-sm bg-slate-700 hover:bg-slate-600 rounded-full w-6 h-6 flex items-center justify-center">×</button>
            </div>
        </div>

        <!-- Output Result -->
        <div class="space-y-2">
            <label class="block text-xs font-medium text-slate-400">完成URL</label>
            <div class="p-3 bg-slate-950 rounded-xl border border-slate-700/80 break-all text-sm font-mono text-emerald-400 min-h-[48px] flex items-center" id="urlOutput">
                https://doron-san.github.io/gemini-canvas/
            </div>
        </div>

        <!-- Buttons -->
        <div class="flex gap-3">
            <button id="copyBtn" class="flex-1 bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                <span>📋 URLをコピー</span>
            </button>
            <a id="openBtn" href="#" target="_blank" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-1 text-sm">
                <span>開く</span> ↗
            </a>
        </div>

        <!-- Toast Notification Message -->
        <div id="toast" class="hidden text-center py-2 px-4 bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs rounded-lg transition-all">
            URLをクリップボードにコピーしました！Notionにそのまま貼り付けられます。
        </div>

        <!-- History Section -->
        <div class="pt-4 border-t border-slate-700/60">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold text-slate-400">最近作成した履歴</span>
                <button id="clearHistoryBtn" class="text-[10px] text-slate-500 hover:text-slate-300 underline">履歴クリア</button>
            </div>
            <div id="historyList" class="space-y-1.5 max-h-36 overflow-y-auto text-xs">
                <p class="text-slate-500 italic text-center py-2">履歴はありません</p>
            </div>
        </div>

    </div>

    <script>
        // DOM Elements
        const usernameInput = document.getElementById('username');
        const repoSelect = document.getElementById('repoSelect');
        const reloadReposBtn = document.getElementById('reloadReposBtn');
        const repoCount = document.getElementById('repoCount');
        const apiStatus = document.getElementById('apiStatus');
        const filenameInput = document.getElementById('filename');
        const urlOutput = document.getElementById('urlOutput');
        const copyBtn = document.getElementById('copyBtn');
        const openBtn = document.getElementById('openBtn');
        const toast = document.getElementById('toast');
        const clearBtn = document.getElementById('clearBtn');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');

        // Storage Keys
        const STORAGE_KEY_USER = 'gh_user';
        const STORAGE_KEY_LAST_REPO = 'gh_last_repo';
        const STORAGE_KEY_HIST = 'gh_url_history';

        window.onload = function() {
            const savedUser = localStorage.getItem(STORAGE_KEY_USER);
            if (savedUser) usernameInput.value = savedUser;

            // Fetch GitHub Repos via API on load
            fetchUserRepositories();

            updateUrl();
            renderHistory();
        };

        async function fetchUserRepositories() {
            const user = usernameInput.value.trim() || 'doron-san';
            
            repoCount.textContent = '取得中...';
            repoCount.className = 'text-[10px] text-blue-400';
            apiStatus.textContent = 'API取得中...';
            apiStatus.className = 'text-[10px] px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300';

            try {
                // GitHub Public Repos API (sorted by updated time)
                const response = await fetch(`https://api.github.com/users/${encodeURIComponent(user)}/repos?per_page=100&sort=updated`);
                
                if (!response.ok) {
                    throw new Error(`User not found or API limit reached (${response.status})`);
                }

                const repos = await response.json();
                
                // Clear existing options
                repoSelect.innerHTML = '';

                if (repos.length === 0) {
                    repoCount.textContent = '0件';
                    repoSelect.innerHTML = '<option value="">(公開リポジトリなし)</option>';
                    return;
                }

                repoCount.textContent = `${repos.length} 件`;
                apiStatus.textContent = '自動同期中';
                apiStatus.className = 'text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300';

                const savedLastRepo = localStorage.getItem(STORAGE_KEY_LAST_REPO);

                // Populate dropdown with fetched repo names
                repos.forEach(repo => {
                    const option = document.createElement('option');
                    option.value = repo.name;
                    option.textContent = repo.name;
                    if (repo.name === savedLastRepo || repo.name === 'gemini-canvas') {
                        option.selected = true;
                    }
                    repoSelect.appendChild(option);
                });

                updateUrl();

            } catch (error) {
                console.error('GitHub API error:', error);
                repoCount.textContent = '取得失敗';
                repoCount.className = 'text-[10px] text-rose-400';
                apiStatus.textContent = '手動モード';
                apiStatus.className = 'text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300';
                
                // Fallback option if user/API fetch fails
                if (repoSelect.options.length === 0) {
                    repoSelect.innerHTML = '<option value="gemini-canvas">gemini-canvas</option>';
                }
            }
        }

        function getGeneratedUrl() {
            const user = usernameInput.value.trim() || 'doron-san';
            const repo = repoSelect.value || 'gemini-canvas';
            let file = filenameInput.value.trim();

            if (file !== '' && !file.endsWith('.html')) {
                file += '.html';
            }

            return `https://${user}.github.io/${repo}/${file}`;
        }

        function updateUrl() {
            const url = getGeneratedUrl();
            urlOutput.textContent = url;
            openBtn.href = url;

            // Toggle clear button
            if (filenameInput.value.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            // Save Settings
            localStorage.setItem(STORAGE_KEY_USER, usernameInput.value.trim());
            if (repoSelect.value) {
                localStorage.setItem(STORAGE_KEY_LAST_REPO, repoSelect.value);
            }
        }

        filenameInput.addEventListener('input', updateUrl);
        repoSelect.addEventListener('change', updateUrl);

        usernameInput.addEventListener('change', () => {
            fetchUserRepositories();
        });

        reloadReposBtn.addEventListener('click', () => {
            fetchUserRepositories();
        });

        clearBtn.addEventListener('click', () => {
            filenameInput.value = '';
            filenameInput.focus();
            updateUrl();
        });

        copyBtn.addEventListener('click', () => {
            const url = getGeneratedUrl();
            
            // Clipboard fallback for embedded environments
            const tempTextarea = document.createElement('textarea');
            tempTextarea.value = url;
            document.body.appendChild(tempTextarea);
            tempTextarea.select();
            
            try {
                document.execCommand('copy');
                showToast();
                saveToHistory(url);
            } catch (err) {
                console.error('Copy failed', err);
            } finally {
                document.body.removeChild(tempTextarea);
            }
        });

        function showToast() {
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        function saveToHistory(url) {
            let history = JSON.parse(localStorage.getItem(STORAGE_KEY_HIST) || '[]');
            if (history[0] !== url) {
                history.unshift(url);
                if (history.length > 10) history.pop();
                localStorage.setItem(STORAGE_KEY_HIST, JSON.stringify(history));
                renderHistory();
            }
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY_HIST) || '[]');
            if (history.length === 0) {
                historyList.innerHTML = '<p class="text-slate-500 italic text-center py-2">履歴はありません</p>';
                return;
            }

            historyList.innerHTML = history.map(url => `
                <div class="flex items-center justify-between bg-slate-900/80 p-2 rounded border border-slate-800 gap-2">
                    <span class="truncate text-slate-300 font-mono text-[11px] flex-1">${url}</span>
                    <button onclick="copyDirect('${url}')" class="text-[11px] bg-slate-700 hover:bg-slate-600 text-slate-200 px-2 py-0.5 rounded transition-colors">コピー</button>
                </div>
            `).join('');
        }

        window.copyDirect = function(url) {
            const tempTextarea = document.createElement('textarea');
            tempTextarea.value = url;
            document.body.appendChild(tempTextarea);
            tempTextarea.select();
            document.execCommand('copy');
            document.body.removeChild(tempTextarea);
            showToast();
        };

        clearHistoryBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY_HIST);
            renderHistory();
        });
    </script>
</body>
</html>
