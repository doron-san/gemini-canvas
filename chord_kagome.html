    <title>コード譜-かごめ(優里)</title>

    <script src="https://cdn.tailwindcss.com"></script>

            theme: {
                extend: {
                    colors: {

                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],

    <style>
        .chord-mark {
            font-family: 'Fira Code', monospace;
            font-weight: 700;
            line-height: 1;
        }
        .chord-lyric-pair {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            vertical-align: bottom;
            margin-right: 0.2rem;
            margin-bottom: 0.6rem;
        }
        .chord-lyric-pair .chord {
            min-height: 1.35rem;
            color: #fbbf24;
            font-size: 0.88rem;
            font-weight: 700;
            font-family: 'Fira Code', monospace;
            user-select: none;
            padding: 0 3px;
            border-radius: 4px;
            transition: all 0.15s ease;
        }
        .chord-lyric-pair .chord:hover {
            color: #f59e0b;
            background-color: rgba(251, 191, 36, 0.15);
        }
        .chord-lyric-pair .lyric {
            font-size: 0.98rem;
            color: #f8fafc;
            font-weight: 500;
            white-space: pre;
            line-height: 1.5;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col selection:bg-amber-500 selection:text-slate-900 relative">

    <header class="border-b border-slate-800 bg-slate-900/95 backdrop-blur sticky top-0 z-40 shadow-md">

            <div class="flex items-center gap-3">

                    <i class="fa-solid fa-guitar"></i>
                </div>
                <div>
                    <h1 class="text-base md:text-lg font-bold leading-tight flex items-center gap-2">
                        かごめ <span class="text-xs text-amber-400 font-normal border border-amber-500/40 px-2 py-0.5 rounded-full bg-amber-500/10">優里</span>
                    </h1>
                    <p class="text-[11px] text-slate-400">U-Fret画像完全再現・インタラクティブ楽譜</p>
                </div>
            </div>

            <!-- コントロールエリア (音色プリセット ＆ Capo切替 ＆ 編集モード) -->
            <div class="flex flex-wrap items-center gap-2">
                <!-- 音色プリセット選択Dropdown -->
                <div class="flex items-center gap-1.5 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800">
                    <i class="fa-solid fa-sliders text-amber-400 text-xs"></i>
                    <select id="soundPresetSelect" onchange="changeSoundPreset(this.value)" class="bg-transparent text-amber-300 text-xs font-bold focus:outline-none cursor-pointer">
                        <option value="acoustic" selected class="bg-slate-900 text-slate-100">アコースティックギター (リッチ)</option>
                        <option value="elepi" class="bg-slate-900 text-slate-100">エレピ (透明感・ベル音)</option>
                        <option value="nylon" class="bg-slate-900 text-slate-100">ナイロン弦ギター (温かい)</option>
                        <option value="ukulele" class="bg-slate-900 text-slate-100">ウクレレ (コロコロ軽快)</option>
                        <option value="organ" class="bg-slate-900 text-slate-100">オルガン (重厚・持続音)</option>
                    </select>
                </div>

                <!-- Capo / 原曲キー 切替 -->
                <div class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
                    <button id="btnCapo2Key" onclick="setCapoMode('capo2')" class="px-2.5 py-1 rounded-lg font-bold transition bg-amber-500 text-slate-950 shadow">
                        Capo 2 (画像通り)
                    </button>
                    <button id="btnOriginalKey" onclick="setCapoMode('original')" class="px-2.5 py-1 rounded-lg font-bold text-slate-400 hover:text-slate-200 transition">
                        原曲実音 (+2)
                    </button>
                </div>

                <!-- 編集モードボタン -->
                <button onclick="openEditorModal()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-700 transition active:scale-95">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span>楽譜編集</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 my-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-8 shadow-2xl space-y-6">
            
            <!-- ステータス表示 -->
            <div class="flex flex-wrap items-center justify-between pb-4 border-b border-slate-800 text-xs text-slate-400 gap-2">
                <div class="flex flex-wrap items-center gap-4">
                    <span><i class="fa-solid fa-sliders text-amber-400 mr-1"></i> 表示: <strong id="capoDisplayStatus" class="text-amber-400">Capo 2 (画像通り)</strong></span>
                    <span><i class="fa-solid fa-wave-square text-emerald-400 mr-1"></i> 音色: <strong id="presetDisplayStatus" class="text-emerald-400">アコースティックギター (リッチ)</strong></span>
                </div>
                <div class="flex items-center gap-3">
                    <span id="saveStatusIndicator" class="text-slate-400 font-medium flex items-center gap-1 text-[11px]">
                        <i class="fa-solid fa-floppy-disk text-slate-500"></i> LocalStorage同期完了
                    </span>
                    <button onclick="resetToDefaultData()" class="text-slate-500 hover:text-rose-400 text-xs underline transition">
                        初期化
                    </button>
                </div>
            </div>

            <!-- 楽譜描画エリア -->
            <div id="scoreContainer" class="space-y-6">
                <!-- JavaScriptで安全に動的生成 -->
            </div>
        </div>
    </main>

    <!-- 楽譜編集モーダル -->
    <div id="editorModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full p-6 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-code text-amber-400"></i> 楽譜データ構造編集 (JSON)
                </h3>
                <button onclick="closeEditorModal()" class="text-slate-400 hover:text-slate-100 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <p class="text-xs text-slate-400 mb-3">
                セクション構造、コード名、歌詞文字列を修正できます。保存するとブラウザの <code>localStorage</code> に保持されます。
            </p>

            <textarea id="editorJsonInput" class="flex-1 min-h-[300px] w-full bg-slate-950 border border-slate-800 rounded-xl p-3 font-mono text-xs text-amber-300 focus:outline-none focus:border-amber-500 resize-y leading-relaxed mb-4"></textarea>

            <div class="flex items-center justify-end gap-3 pt-2 border-t border-slate-800">
                <button onclick="closeEditorModal()" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 transition">

                </button>
                <button onclick="saveEditorData()" class="px-4 py-2 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-md transition">
                    保存して反映
                </button>

    </div>

        // 初期化ロード
        function initData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    activeScoreData = JSON.parse(saved);
                } else {
                    activeScoreData = JSON.parse(JSON.stringify(DEFAULT_SCORE_DATA));
                }
            } catch (e) {
                console.error("Failed to load score data from localStorage:", e);
                activeScoreData = JSON.parse(JSON.stringify(DEFAULT_SCORE_DATA));
            }
        }

        // 音色プリセット変更
        function changeSoundPreset(preset) {
            currentPreset = preset;
            const statusMap = {
                'elepi': 'エレピ (透明感・ベル音)',
                'nylon': 'ナイロン弦ギター (温かい)',
                'ukulele': 'ウクレレ (コロコロ軽快)',
                'organ': 'オルガン (重厚・持続音)',
                'acoustic': 'アコースティックギター (リッチ)'
            };
            const presetStatus = document.getElementById('presetDisplayStatus');
            if (presetStatus) presetStatus.innerText = statusMap[preset] || preset;
        }

        // Capoモード切替
        function setCapoMode(mode) {
            currentCapoMode = mode;
            const btnOrig = document.getElementById('btnOriginalKey');
            const btnCapo2 = document.getElementById('btnCapo2Key');
            const status = document.getElementById('capoDisplayStatus');

            if (mode === 'capo2') {
                btnCapo2.className = "px-2.5 py-1 rounded-lg font-bold transition bg-amber-500 text-slate-950 shadow";
                btnOrig.className = "px-2.5 py-1 rounded-lg font-bold text-slate-400 hover:text-slate-200 transition";
                status.innerText = "Capo 2 (画像通り)";
            } else {
                btnOrig.className = "px-2.5 py-1 rounded-lg font-bold transition bg-amber-500 text-slate-950 shadow";
                btnCapo2.className = "px-2.5 py-1 rounded-lg font-bold text-slate-400 hover:text-slate-200 transition";
                status.innerText = "原曲実音 (Capo 0 相当: +2半音)";
            }

            renderScore();
        }

        function getDisplayChord(chord) {
            if (!chord) return '';
            if (currentCapoMode === 'original') {
                return capo2ToOriginalMap[chord] || chord;
            }
            return chord;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // 楽譜の描画
        function renderScore() {
            const container = document.getElementById('scoreContainer');
            if (!container) return;
            container.innerHTML = '';

            if (!Array.isArray(activeScoreData) || activeScoreData.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-slate-500">楽譜データが存在しません。「楽譜編集」から追加してください。</div>';
                return;
            }

            activeScoreData.forEach(sec => {
                const secDiv = document.createElement('div');
                secDiv.className = "space-y-3 pb-4 border-b border-slate-800/80 last:border-0";

                const title = document.createElement('h3');
                title.className = "text-xs font-bold text-amber-400 bg-amber-500/10 border border-amber-500/20 px-3 py-1 rounded-lg inline-block mb-1";
                title.innerText = sec.title || "無題セクション";
                secDiv.appendChild(title);

                if (Array.isArray(sec.content)) {
                    sec.content.forEach(line => {
                        const lineDiv = document.createElement('div');
                        lineDiv.className = "flex flex-wrap items-end my-1 p-1 rounded hover:bg-slate-850/40 transition";

                        if (line.chordsOnly) {
                            line.chordsOnly.forEach(chord => {
                                const displayChord = getDisplayChord(chord);
                                const chordSpan = document.createElement('span');
                                chordSpan.className = "chord-mark text-amber-400 mr-6 text-sm hover:text-amber-300 cursor-pointer bg-slate-950 px-2.5 py-1 rounded border border-slate-800 shadow-sm active:scale-95 transition";
                                chordSpan.innerText = displayChord || ' ';
                                chordSpan.onclick = () => playSynthChordSound(chord);
                                lineDiv.appendChild(chordSpan);
                            });
                        } else if (line.pairs) {
                            line.pairs.forEach(pair => {
                                const pairDiv = document.createElement('div');
                                pairDiv.className = "chord-lyric-pair";
                                const displayChord = getDisplayChord(pair.c);

                                pairDiv.innerHTML = `
                                    <span class="chord cursor-pointer hover:underline" onclick="playSynthChordSound('${pair.c || ''}')">${displayChord || ' '}</span>
                                    <span class="lyric">${escapeHtml(pair.t || '')}</span>
                                `;
                                lineDiv.appendChild(pairDiv);
                            });
                        }

                        secDiv.appendChild(lineDiv);
                    });
                }

                container.appendChild(secDiv);
            });
        }

        // Web Audio API による和音再生 (Dimコード補正ロジック含む)
        function playSynthChordSound(originalChord) {
            if (!originalChord) return;
            
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                let freqs = CHORD_FREQUENCIES[originalChord];

                // 未知のコード名の場合の安全なフォールバック
                if (!freqs || freqs.length === 0) {
                    freqs = [138.59, 207.65, 277.18, 329.63]; // C#m7 相当のフォールバック
                }

                // Dim (ディミニッシュ) コード低音濁り防止の1オクターブ(+12)上周波数適用
                const isDim = originalChord.toLowerCase().includes('dim');
                const processedFreqs = freqs.map(f => isDim ? f * 1.5 : f);

                if (currentPreset === 'elepi') {
                    // エレピ
                    processedFreqs.forEach((freq, index) => {
                        const startTime = now + (index * 0.008);

                        const oscMain = audioCtx.createOscillator();
                        oscMain.type = 'sine';
                        oscMain.frequency.setValueAtTime(freq, startTime);

                        const oscBell = audioCtx.createOscillator();
                        oscBell.type = 'sine';
                        oscBell.frequency.setValueAtTime(freq * 3.98, startTime);

                        const mainGain = audioCtx.createGain();
                        mainGain.gain.setValueAtTime(0.0001, startTime);
                        mainGain.gain.linearRampToValueAtTime(0.2, startTime + 0.005);
                        mainGain.gain.exponentialRampToValueAtTime(0.0001, startTime + 2.2);

                        const bellGain = audioCtx.createGain();
                        bellGain.gain.setValueAtTime(0.0001, startTime);
                        bellGain.gain.linearRampToValueAtTime(0.08, startTime + 0.002);
                        bellGain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.3);

                        oscMain.connect(mainGain);
                        oscBell.connect(bellGain);
                        mainGain.connect(audioCtx.destination);
                        bellGain.connect(audioCtx.destination);

                        oscMain.start(startTime);
                        oscBell.start(startTime);
                        oscMain.stop(startTime + 2.3);
                        oscBell.stop(startTime + 0.35);
                    });

                } else if (currentPreset === 'nylon') {
                    // ナイロン弦ギター
                    processedFreqs.forEach((f, i) => {
                        const startTime = now + i * 0.03;

                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        const filter = audioCtx.createBiquadFilter();

                        osc.type = (i % 2 === 0) ? 'triangle' : 'sine';
                        osc.frequency.setValueAtTime(f, startTime);

                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(850, startTime);

                        gain.gain.setValueAtTime(0.001, startTime);
                        gain.gain.exponentialRampToValueAtTime(0.18, startTime + 0.012);
                        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 1.5);

                        osc.connect(filter);
                        filter.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc.start(startTime);
                        osc.stop(startTime + 1.55);
                    });

                } else if (currentPreset === 'ukulele') {
                    // ウクレレ
                    processedFreqs.forEach((freq, index) => {
                        const startTime = now + (index * 0.012);

                        const osc = audioCtx.createOscillator();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq * 1.4, startTime);

                        const gain = audioCtx.createGain();
                        gain.gain.setValueAtTime(0.0001, startTime);
                        gain.gain.linearRampToValueAtTime(0.2, startTime + 0.005);
                        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.9);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc.start(startTime);
                        osc.stop(startTime + 0.95);
                    });

                } else if (currentPreset === 'organ') {
                    // オルガン
                    processedFreqs.forEach((freq) => {
                        [1, 2].forEach((harmonic, hIdx) => {
                            const osc = audioCtx.createOscillator();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(freq * harmonic, now);

                            const gain = audioCtx.createGain();
                            const vol = 0.1 / (hIdx + 1);
                            gain.gain.setValueAtTime(0.0001, now);
                            gain.gain.linearRampToValueAtTime(vol, now + 0.04);
                            gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.6);

                            osc.connect(gain);
                            gain.connect(audioCtx.destination);

                            osc.start(now);
                            osc.stop(now + 1.65);
                        });
                    });

                } else {
                    // アコースティックギター (リッチ)
                    processedFreqs.forEach((freq, index) => {
                        const startTime = now + (index * 0.02);

                        const oscSaw = audioCtx.createOscillator();
                        oscSaw.type = 'sawtooth';
                        oscSaw.frequency.setValueAtTime(freq, startTime);

                        const oscTri = audioCtx.createOscillator();
                        oscTri.type = 'triangle';
                        oscTri.frequency.setValueAtTime(freq, startTime);

                        const filter = audioCtx.createBiquadFilter();
                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(1200, startTime);

                        const gain = audioCtx.createGain();
                        gain.gain.setValueAtTime(0.0001, startTime);
                        gain.gain.linearRampToValueAtTime(0.16, startTime + 0.008);
                        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 1.7);

                        oscSaw.connect(filter);
                        oscTri.connect(filter);
                        filter.connect(gain);
                        gain.connect(audioCtx.destination);

                        oscSaw.start(startTime);
                        oscTri.start(startTime);
                        oscSaw.stop(startTime + 1.75);
                        oscTri.stop(startTime + 1.75);
                    });
                }
            } catch (err) {
                console.error("Audio playback error:", err);
            }
        }

        // モーダル操作 & データ保存
        function openEditorModal() {
            const textarea = document.getElementById('editorJsonInput');
            if (textarea) {
                textarea.value = JSON.stringify(activeScoreData, null, 2);
            }
            const modal = document.getElementById('editorModal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeEditorModal() {
            const modal = document.getElementById('editorModal');
            if (modal) modal.classList.add('hidden');
        }

        function saveEditorData() {
            const textarea = document.getElementById('editorJsonInput');
            if (!textarea) return;

            try {
                const parsed = JSON.parse(textarea.value);
                if (!Array.isArray(parsed)) {
                    showToast("配列形式のJSONを入力してください", "error");
                    return;
                }
                activeScoreData = parsed;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(activeScoreData));
                renderScore();
                closeEditorModal();
                showToast("楽譜データを保存・反映しました", "success");
            } catch (e) {
                console.error("JSON Syntax Error:", e);
                showToast("JSONの構文エラーです。内容を確認してください", "error");
            }
        }

        function resetToDefaultData() {
            try {
                activeScoreData = JSON.parse(JSON.stringify(DEFAULT_SCORE_DATA));
                localStorage.removeItem(STORAGE_KEY);
                renderScore();
                showToast("初期データにリセットしました", "success");
            } catch (e) {
                console.error("Reset error:", e);
            }
        }

        // トースト表示関数 (alert不使用)
        function showToast(msg, type = "success") {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');
            if (!toast || !toastMsg || !toastIcon) return;

            toastMsg.innerText = msg;
            if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400 text-base";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-base";
            }

            toast.classList.remove('translate-y-16', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('translate-y-16', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // アプリ起動
        window.onload = function() {
            initData();
            renderScore();
        };
    </script>
