<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Studio Pro - 4テーマ対応 左右対比型Markdownエディタ</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- KaTeX CSS & JS (Math Rendering) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Highlight.js (Code Syntax Highlighting) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css" id="hljs-theme">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <!-- Marked.js (Markdown Parsing) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap');

    /* 
      全4テーマのCSS変数定義
      画面全体（ヘッダー、エディタ、プレビュー、枠線、文字色、コード背景）が連動
    */
    :root, html[data-theme="light"] {
      --bg-main: #f9fafb;
      --bg-header: #ffffff;
      --bg-panel: #ffffff;
      --bg-subHeader: #f3f4f6;
      --bg-button: #f3f4f6;
      --bg-button-hover: #e5e7eb;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --border-color: #e5e7eb;
      --accent-color: #0284c7;
      --accent-text: #ffffff;
      --code-bg: #f3f4f6;
      --blockquote-border: #0284c7;
      --highlight-bg: #fef08a;
      --highlight-text: #000000;
    }

    html[data-theme="dark"] {
      --bg-main: #111827;
      --bg-header: #1f2937;
      --bg-panel: #111827;
      --bg-subHeader: #1f2937;
      --bg-button: #374151;
      --bg-button-hover: #4b5563;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --border-color: #374151;
      --accent-color: #38bdf8;
      --accent-text: #0f172a;
      --code-bg: #1f2937;
      --blockquote-border: #38bdf8;
      --highlight-bg: #854d0e;
      --highlight-text: #fef08a;
    }

    /* ご指定色1: アクアブルー (#c7eef2) */
    html[data-theme="turquoise"] {
      --bg-main: #b0e3e8;
      --bg-header: #9edce2;
      --bg-panel: #c7eef2; /* 新ご指定のメイン背景色 */
      --bg-subHeader: #b3e4e9;
      --bg-button: #bde9ed;
      --bg-button-hover: #a8dee3;
      --text-primary: #0a2e33; /* 視認性を重視した濃いダークティール文字 */
      --text-secondary: #18525b;
      --border-color: #9bd0d6;
      --accent-color: #0f525c;
      --accent-text: #ffffff;
      --code-bg: #b8e5ea;
      --blockquote-border: #0f525c;
      --highlight-bg: #fef08a;
      --highlight-text: #0a2e33;
    }

    /* ご指定色2: ミントクリーム (#f1f5d3) */
    html[data-theme="cream"] {
      --bg-main: #e2e6bf;
      --bg-header: #d3d8ab;
      --bg-panel: #f1f5d3; /* 指定のメイン背景 */
      --bg-subHeader: #d9deaf;
      --bg-button: #e0e5b7;
      --bg-button-hover: #d3d8ab;
      --text-primary: #292d0b;
      --text-secondary: #4a501a;
      --border-color: #c0c694;
      --accent-color: #4a501a;
      --accent-text: #f1f5d3;
      --code-bg: #e2e6bf;
      --blockquote-border: #4a501a;
      --highlight-bg: #d9f99d;
      --highlight-text: #1a2e05;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    textarea, code, pre {
      font-family: 'Fira Code', monospace;
    }

    /* アプリ全体にテーマ変数を展開 */
    .app-header {
      background-color: var(--bg-header);
      border-color: var(--border-color);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .app-panel {
      background-color: var(--bg-panel);
      border-color: var(--border-color);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .app-subheader {
      background-color: var(--bg-subHeader);
      border-color: var(--border-color);
      color: var(--text-secondary);
    }

    .app-button {
      background-color: var(--bg-button);
      color: var(--text-primary);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app-button:hover {
      background-color: var(--bg-button-hover);
    }

    .app-badge {
      background-color: var(--accent-color);
      color: var(--accent-text);
    }

    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 100, 100, 0.3);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 100, 100, 0.5);
    }

    /* Markdownコンテンツスタイル */
    .markdown-body {
      color: var(--text-primary);
    }
    .markdown-body h1 { font-size: 2em; font-weight: 700; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; margin-top: 1.2em; margin-bottom: 0.8em; }
    .markdown-body h2 { font-size: 1.5em; font-weight: 600; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; margin-top: 1.1em; margin-bottom: 0.6em; }
    .markdown-body h3 { font-size: 1.25em; font-weight: 600; margin-top: 1em; margin-bottom: 0.5em; }
    .markdown-body h4 { font-size: 1em; font-weight: 600; margin-top: 0.9em; margin-bottom: 0.4em; }
    .markdown-body p { margin-bottom: 1em; line-height: 1.7; }
    .markdown-body ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
    .markdown-body ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
    .markdown-body li { margin-bottom: 0.3em; }
    .markdown-body blockquote { 
      border-left: 4px solid var(--blockquote-border); 
      padding-left: 1em; 
      color: var(--text-secondary); 
      margin: 1em 0; 
      font-style: italic; 
    }
    .markdown-body table { border-collapse: collapse; width: 100%; margin-bottom: 1em; }
    .markdown-body th, .markdown-body td { border: 1px solid var(--border-color); padding: 0.5em 0.8em; text-align: left; }
    .markdown-body th { background-color: var(--bg-subHeader); font-weight: 600; }
    .markdown-body hr { height: 2px; background-color: var(--border-color); border: none; margin: 2em 0; }
    .markdown-body img { max-width: 100%; border-radius: 0.375rem; margin: 1em 0; }
    .markdown-body code:not(pre code) { 
      background-color: var(--code-bg); 
      padding: 0.2em 0.4em; 
      border-radius: 4px; 
      font-size: 85%; 
    }
    .markdown-body pre { 
      background-color: var(--code-bg) !important; 
      padding: 1em; 
      border-radius: 0.5rem; 
      overflow-x: auto; 
      margin-bottom: 1em; 
      border: 1px solid var(--border-color);
    }
    .markdown-body mark { 
      background-color: var(--highlight-bg); 
      color: var(--highlight-text);
      padding: 0.1em 0.3em; 
      border-radius: 2px; 
    }

    .markdown-body input[type="checkbox"] { margin-right: 0.5em; vertical-align: middle; }

    #drop-overlay {
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
    }
  </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">

        <button id="btn-sample" class="app-button px-3 py-1.5 text-xs font-medium rounded-md flex items-center gap-1.5 shadow-xs ml-1" title="サンプル文章を読み込む">
          <i class="fa-solid fa-file-lines text-blue-500"></i>

      <!-- 表示モードグループ (分割 / エディタのみ / プレビューのみ) -->

      <!-- テーマ選択プルダウン (全4モード一括切替) -->
      <div class="flex items-center gap-1.5 app-subheader px-2.5 py-1 rounded-lg border border-[var(--border-color)]">

        </select>
      </div>
    </div>
  </header>

  <!-- 隠しファイル入力タグ -->
  <input type="file" id="file-input" accept=".md,.markdown,.txt" class="hidden">

  <!-- メインエリア -->

    <!-- ファイルドラッグ＆ドロップ用オーバーレイ -->

    <!-- トースト通知コンテナ -->

    <!-- 左側: エディタ領域 -->

          <i class="fa-solid fa-code opacity-60"></i> EDITOR
        </span>
        <div id="editor-stats" class="flex gap-3">
          <span>文字数: <strong id="stat-chars">0</strong></span>
          <span>単語数: <strong id="stat-words">0</strong></span>

      <!-- 入力エリア -->

  <script>
    // ==========================================
    // 要素参照 & 状態管理
    // ==========================================
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const editorContainer = document.getElementById('editor-container');
    const previewContainer = document.getElementById('preview-container');
    const fileInput = document.getElementById('file-input');
    const dropOverlay = document.getElementById('drop-overlay');
    const themeSelect = document.getElementById('theme-select');

    let currentFileHandle = null;
    let currentFileName = '無題.md';
    let isDirty = false;

    const filenameDisplay = document.getElementById('current-filename-display');
    const dirtyIndicator = document.getElementById('dirty-indicator');
    const toastContainer = document.getElementById('toast-container');

    const statChars = document.getElementById('stat-chars');
    const statWords = document.getElementById('stat-words');
    const statLines = document.getElementById('stat-lines');

    let viewMode = 'split';
    let isSyncingScroll = false;
    let renderDebounceTimer = null;

    // ==========================================
    // 4テーマ完全切替処理
    // ==========================================
    /**
     * テーマ選択変更時の処理（ライト/ダーク/ターコイズ/クリーム）
     * html タグの data-theme 属性を変更することで全CSS変数を一括変更します
     */
    function applyTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('markdown_studio_theme_mode', themeName);

      // Highlight.js のテーマCSS切替
      const hljsStyle = document.getElementById('hljs-theme');
      if (hljsStyle) {
        if (themeName === 'dark') {
          hljsStyle.href = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css";
        } else {
          hljsStyle.href = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css";
        }
      }
    }

    themeSelect.addEventListener('change', (e) => {
      applyTheme(e.target.value);
    });

    // サンプルMarkdownテキスト
    const SAMPLE_MARKDOWN = `# Markdown Studio Pro へようこそ！

これは**4つのテーマに対応した左右対比型Markdownエディタ**です。
右上のプルダウンから画面全体を「ライト」「ダーク」「アクアブルー」「ミントクリーム」に一括変更できます。

* ==ハイライトテキスト== で特定の文字列を強調

## 2. リスト構造
### 箇条書きリスト

  - バナナ
- 野菜

### タスクリスト

    // Marked.js の設定
    marked.setOptions({
      gfm: true,
      breaks: true,
    });

    /**
     * 前処理: ==ハイライト== を <mark> に変換
     */
    function preprocessMarkdown(text) {
      if (!text) return '';
      return text.replace(/==([^=]+)==/g, '<mark>$1</mark>');
    }

    /**
     * リアルタイムレンダリング
     */
    function renderMarkdown() {
      const rawText = editor.value;
      updateStats(rawText);

      const processed = preprocessMarkdown(rawText);
      const html = marked.parse(processed);
      preview.innerHTML = html;

      // Highlight.js コード適用
      preview.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });

      // KaTeX 数式レンダー適用
      if (window.renderMathInElement) {
        renderMathInElement(preview, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true }
          ],
          throwOnError: false
        });
      }
    }

    function triggerRender() {
      clearTimeout(renderDebounceTimer);
      renderDebounceTimer = setTimeout(renderMarkdown, 50);
    }

    function updateFileUI() {
      if (filenameDisplay) filenameDisplay.textContent = currentFileName;
      if (dirtyIndicator) {
        if (isDirty) dirtyIndicator.classList.remove('hidden');
        else dirtyIndicator.classList.add('hidden');
      }
    }

    function markAsDirty() {
      if (!isDirty) {
        isDirty = true;
        updateFileUI();
      }
    }

    function markAsClean() {
      isDirty = false;
      updateFileUI();
    }

    function showNotification(message, iconClass = 'fa-check-circle text-emerald-500') {
      const toast = document.createElement('div');
      toast.className = 'app-header text-xs px-3.5 py-2.5 rounded-lg shadow-lg flex items-center gap-2 border border-[var(--border-color)] opacity-0 transform translate-y-2 transition-all duration-300 pointer-events-auto';
      toast.innerHTML = `<i class="fa-solid ${iconClass}"></i> <span>${message}</span>`;
      
      toastContainer.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove('opacity-0', 'translate-y-2'));

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    function updateStats(text) {
      statChars.textContent = text.length.toLocaleString();
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      statWords.textContent = words.toLocaleString();
      const lines = text ? text.split('\n').length : 0;
      statLines.textContent = lines.toLocaleString();
    }

    // 表示モード切り替え
    const btnViewSplit = document.getElementById('btn-view-split');
    const btnViewEdit = document.getElementById('btn-view-edit');
    const btnViewPreview = document.getElementById('btn-view-preview');

    function setViewMode(mode) {
      viewMode = mode;
      if (mode === 'split') {
        editorContainer.classList.remove('hidden', 'w-full');
        editorContainer.classList.add('w-1/2');
        previewContainer.classList.remove('hidden', 'w-full');
        previewContainer.classList.add('w-1/2');
      } else if (mode === 'edit') {
        editorContainer.classList.remove('hidden', 'w-1/2');
        editorContainer.classList.add('w-full');
        previewContainer.classList.add('hidden');
      } else if (mode === 'preview') {
        editorContainer.classList.add('hidden');
        previewContainer.classList.remove('hidden', 'w-1/2');
        previewContainer.classList.add('w-full');
      }
    }

    btnViewSplit.addEventListener('click', () => setViewMode('split'));
    btnViewEdit.addEventListener('click', () => setViewMode('edit'));
    btnViewPreview.addEventListener('click', () => setViewMode('preview'));

    // スクロール同期
    editor.addEventListener('scroll', () => {
      if (viewMode !== 'split' || isSyncingScroll) return;
      isSyncingScroll = true;
      const percentage = editor.scrollTop / (editor.scrollHeight - editor.clientHeight || 1);
      preview.scrollTop = percentage * (preview.scrollHeight - preview.clientHeight);
      setTimeout(() => { isSyncingScroll = false; }, 50);
    });

    preview.addEventListener('scroll', () => {
      if (viewMode !== 'split' || isSyncingScroll) return;
      isSyncingScroll = true;
      const percentage = preview.scrollTop / (preview.scrollHeight - preview.clientHeight || 1);
      editor.scrollTop = percentage * (editor.scrollHeight - editor.clientHeight);
      setTimeout(() => { isSyncingScroll = false; }, 50);
    });

    // ==========================================
    // ファイル入出力 & 上書き保存 (File System Access API)
    // ==========================================
    async function openFile() {
      if (isDirty && !confirm('未保存の変更があります。破棄してファイルを開きますか？')) return;

      if ('showOpenFilePicker' in window) {
        try {
          const [handle] = await window.showOpenFilePicker({
            types: [{
              description: 'Markdown Files',
              accept: { 'text/markdown': ['.md', '.markdown'], 'text/plain': ['.txt'] }
            }],
            multiple: false
          });
          const file = await handle.getFile();
          const text = await file.text();
          
          currentFileHandle = handle;
          currentFileName = handle.name;
          editor.value = text;
          markAsClean();
          triggerRender();
          showNotification(`「${currentFileName}」を開きました`);
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }
      fileInput.click();
    }

    document.getElementById('btn-open').addEventListener('click', openFile);

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      readFile(file);
    });

    function readFile(file, handle = null) {
      const reader = new FileReader();
      reader.onload = (e) => {
        editor.value = e.target.result;
        currentFileHandle = handle;
        currentFileName = file.name;
        markAsClean();
        triggerRender();
        showNotification(`「${currentFileName}」を開きました`);
      };
      reader.readAsText(file);
    }

    async function saveFile() {
      if (currentFileHandle) {
        try {
          const writable = await currentFileHandle.createWritable();
          await writable.write(editor.value);
          await writable.close();
          markAsClean();
          showNotification(`「${currentFileName}」に上書き保存しました`);
          return;
        } catch (err) {
          showNotification('上書き保存に失敗したため別名保存します', 'fa-exclamation-triangle text-amber-500');
        }
      }
      await saveFileAs();
    }

    async function saveFileAs() {
      if ('showSaveFilePicker' in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: currentFileName || 'document.md',
            types: [{
              description: 'Markdown File',
              accept: { 'text/markdown': ['.md'] }
            }]
          });

          const writable = await handle.createWritable();
          await writable.write(editor.value);
          await writable.close();

          currentFileHandle = handle;
          currentFileName = handle.name;
          markAsClean();
          showNotification(`「${currentFileName}」として保存しました`);
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }
      fallbackDownload();
    }

    function fallbackDownload() {
      const blob = new Blob([editor.value], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = currentFileName || 'document.md';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      markAsClean();
      showNotification(`「${a.download}」をダウンロード保存しました`);
    }

    document.getElementById('btn-save').addEventListener('click', saveFile);
    document.getElementById('btn-save-as').addEventListener('click', saveFileAs);

    document.getElementById('btn-sample').addEventListener('click', () => {
      if (isDirty && !confirm('未保存の変更があります。現在の内容を破棄してサンプルを読み込みますか？')) return;
      editor.value = SAMPLE_MARKDOWN;
      currentFileHandle = null;
      currentFileName = 'サンプル.md';
      markAsClean();
      triggerRender();
      showNotification('サンプル文章を読み込みました');
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      if (confirm('エディタの内容を全消去しますか？')) {
        editor.value = '';
        currentFileHandle = null;
        currentFileName = '無題.md';
        markAsClean();
        triggerRender();
        showNotification('エディタをクリアしました');
      }
    });

    // ドラッグ＆ドロップ
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropOverlay.style.opacity = '1';
    });

    window.addEventListener('dragleave', (e) => {
      if (e.clientX === 0 && e.clientY === 0) dropOverlay.style.opacity = '0';
    });

    window.addEventListener('drop', async (e) => {
      e.preventDefault();
      dropOverlay.style.opacity = '0';
      if (isDirty && !confirm('未保存の変更があります。破棄してドロップしたファイルを開きますか？')) return;

      const items = e.dataTransfer.items;
      if (items && items.length > 0) {
        const item = items[0];
        if (item.kind === 'file') {
          if ('getAsFileSystemHandle' in item) {
            try {
              const handle = await item.getAsFileSystemHandle();
              if (handle && handle.kind === 'file') {
                const file = await handle.getFile();
                readFile(file, handle);
                return;
              }
            } catch (err) {}
          }
          const file = item.getAsFile();
          if (file) readFile(file);
        }
      }
    });

    // キーボードショートカット
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        saveFile();
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
        e.preventDefault();
        openFile();
      }
    });

    window.addEventListener('beforeunload', (e) => {
      if (isDirty) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    editor.addEventListener('input', () => {
      markAsDirty();
      triggerRender();
    });

    // 初期化
    window.onload = () => {
      const savedTheme = localStorage.getItem('markdown_studio_theme_mode') || 'light';
      themeSelect.value = savedTheme;
      applyTheme(savedTheme);

      editor.value = SAMPLE_MARKDOWN;
      currentFileName = 'サンプル.md';
      markAsClean();
      renderMarkdown();

      if (window.innerWidth < 768) {
        setViewMode('edit');
      }
    };
  </script>
</body>
</html>
